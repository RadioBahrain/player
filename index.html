<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Bahrain — Live Player</title>
  <meta name="description" content="Listen to Radio Bahrain live streams" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --accent: #c8a96e;
      --accent-hover: #e0c484;
      --text: #f0ece4;
      --muted: #888;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 2.4rem;
      color: #0d0d0d;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .stations {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .station-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }

    .station-btn:hover {
      border-color: var(--accent);
      background: #1f1f1f;
    }

    .station-btn.active {
      border-color: var(--accent);
      background: rgba(200,169,110,0.08);
    }

    .station-btn .name { font-weight: 600; }
    .station-btn .freq { color: var(--muted); font-size: 0.82rem; }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .indicator.playing {
      background: #4caf50;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .play-btn {
      flex: 1;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .play-btn:hover { background: var(--accent-hover); }
    .play-btn:active { transform: scale(0.97); }
    .play-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .volume-wrap svg { color: var(--muted); flex-shrink: 0; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 90px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .status {
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 18px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.78rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📻</div>
    <h1>Radio Bahrain</h1>
    <p class="subtitle">Live Streams</p>

    <div class="stations" id="stations"></div>

    <div class="controls">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <span id="playIcon">▶</span>
        <span id="playLabel">Play</span>
      </button>
      <div class="volume-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" />
      </div>
    </div>

    <p class="status" id="status">Select a station to begin</p>
  </div>

  <footer>© Radio Bahrain</footer>

  <audio id="audio" preload="none"></audio>

  <script>
    const stations = [
      { name: "Radio Bahrain", freq: "96.5 FM", url: "https://stream.radiobahrain.com/96.5" },
      { name: "Radio Bahrain 2", freq: "97.5 FM", url: "https://stream.radiobahrain.com/97.5" },
    ];

    let currentIndex = -1;

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const playLabel = document.getElementById("playLabel");
    const statusEl = document.getElementById("status");

    function buildStations() {
      const container = document.getElementById("stations");
      stations.forEach((s, i) => {
        const btn = document.createElement("button");
        btn.className = "station-btn";
        btn.id = "station-" + i;
        btn.innerHTML = `
          <div>
            <div class="name">${s.name}</div>
            <div class="freq">${s.freq}</div>
          </div>
          <span class="indicator" id="ind-${i}"></span>
        `;
        btn.onclick = () => selectStation(i);
        container.appendChild(btn);
      });
    }

    function selectStation(i) {
      if (currentIndex === i && !audio.paused) return;
      currentIndex = i;
      document.querySelectorAll(".station-btn").forEach((b, j) => {
        b.classList.toggle("active", j === i);
        document.getElementById("ind-" + j).className = "indicator";
      });
      audio.src = stations[i].url;
      audio.load();
      audio.play().catch(() => setStatus("Couldn't connect — check stream URL"));
    }

    function togglePlay() {
      if (currentIndex < 0) { selectStation(0); return; }
      if (audio.paused) audio.play().catch(() => setStatus("Playback failed"));
      else audio.pause();
    }

    function setVolume(v) { audio.volume = parseFloat(v); }

    function setStatus(msg) { statusEl.textContent = msg; }

    function updateUI() {
      const playing = !audio.paused;
      playIcon.textContent = playing ? "⏸" : "▶";
      playLabel.textContent = playing ? "Pause" : "Play";
      if (currentIndex >= 0) {
        document.getElementById("ind-" + currentIndex).className = "indicator" + (playing ? " playing" : "");
      }
    }

    audio.addEventListener("playing", () => { updateUI(); setStatus("🎙 On air — " + stations[currentIndex].name); });
    audio.addEventListener("pause", () => { updateUI(); setStatus("Paused"); });
    audio.addEventListener("waiting", () => setStatus("Buffering…"));
    audio.addEventListener("error", () => setStatus("Stream error — retrying…"));
    audio.addEventListener("stalled", () => setStatus("Stream stalled…"));

    buildStations();
  </script>
</body>
</html>
