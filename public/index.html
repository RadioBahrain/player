        <div class="station-pill ar" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-93-3_all/chunklist_w984020168_b981072.m3u8">93.3 بحرين FM</div>
        <div class="station-pill ar" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-93-3_all/chunklist_w733356446_b981072.m3u8">الشعبية 95.0 FM</div>
        <div class="station-pill ar" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-106-1_all/chunklist_w1199630148_b981072.m3u8">القرآن الكريم 106.1 FM</div>

      <div class="controls">
        <button id="btnPlay" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center"><i class="ph ph-play text-xl"></i></button>
        <div class="flex items-center gap-2 flex-1 mx-4"><i class="ph ph-speaker-low text-white/60"></i><input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" class="w-full accent-red-500 h-1"><i class="ph ph-speaker-high text-white/60"></i></div>

  <audio id="audio" crossorigin="anonymous" preload="auto" style="display:none"></audio>
<script>
let audioCtx, analyser, gainNode, sourceNode, hls, isPlaying=false, isInit=false;
let bufferLen, dataArray, smoothed, peaks, vels;
let currentMode='bars';
let currentUrl=document.querySelector('.station-pill.active').dataset.url;
const audioEl=document.getElementById('audio');
const btnPower=document.getElementById('btnPower');
const btnPlay=document.getElementById('btnPlay');
const playIcon=btnPlay.querySelector('i');
const statusText=document.getElementById('statusText');
const liveDot=document.getElementById('liveDot');
const vol=document.getElementById('vol');
const canvasO=document.getElementById('canvas-outer');
const canvasI=document.getElementById('canvas-inner');
const ctxO=canvasO.getContext('2d');
const ctxI=canvasI.getContext('2d');
const modeBtns=document.querySelectorAll('.mode-btn');
const stationPills=document.querySelectorAll('.station-pill');
const aboutBtn=document.getElementById('aboutBtn');
const aboutTray=document.getElementById('aboutTray');
const splash=document.getElementById('splash');
const splashBar=document.getElementById('splashBar');
let aboutTl=null;
function initEngine(){ if(isInit) return; const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); analyser=audioCtx.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=0.55; bufferLen=analyser.frequencyBinCount; dataArray=new Uint8Array(bufferLen); smoothed=new Float32Array(96); peaks=new Float32Array(96); vels=new Float32Array(96); gainNode=audioCtx.createGain(); sourceNode=audioCtx.createMediaElementSource(audioEl); sourceNode.connect(gainNode); gainNode.connect(analyser); analyser.connect(audioCtx.destination); gainNode.gain.value=parseFloat(vol.value); isInit=true; }
function setStatus(state, textAr){ statusText.textContent=textAr; if(state==='live') liveDot.classList.add('live'); else liveDot.classList.remove('live'); }
function loadStream(url){ if(hls){hls.destroy();hls=null;} setStatus('loading','جاري التحميل...'); if(Hls.isSupported()){ hls=new Hls({ enableWorker:true }); hls.loadSource(url); hls.attachMedia(audioEl); } else { audioEl.src=url; } }
async function toggle(){ initEngine(); if(audioCtx.state==='suspended') await audioCtx.resume(); if(!isPlaying){ try{ await audioEl.play(); isPlaying=true; btnPower.classList.add('playing'); playIcon.className='ph ph-pause'; setStatus('live','مباشر • LIVE'); }catch(e){ setStatus('loading','اضغط للتشغيل'); } } else { audioEl.pause(); isPlaying=false; btnPower.classList.remove('playing'); playIcon.className='ph ph-play'; setStatus('paused','متوقف'); } }
audioEl.addEventListener('playing', ()=>{ isPlaying=true; btnPower.classList.add('playing'); playIcon.className='ph ph-pause'; setStatus('live','مباشر • LIVE'); });
audioEl.addEventListener('pause', ()=>{ isPlaying=false; btnPower.classList.remove('playing'); playIcon.className='ph ph-play'; });
audioEl.addEventListener('waiting', ()=>{ setStatus('loading','جاري التحميل...'); });
audioEl.addEventListener('canplay', ()=>{ if(isPlaying) setStatus('live','مباشر • LIVE'); else setStatus('paused','جاهز للتشغيل'); });
vol.addEventListener('input',e=>{ const v=parseFloat(e.target.value); if(gainNode) gainNode.gain.value=v; audioEl.volume=v; });
document.getElementById('btnMute').addEventListener('click',()=>{ if(!gainNode) return; gainNode.gain.value=gainNode.gain.value>0?0:parseFloat(vol.value); });
stationPills.forEach(p=>{ p.addEventListener('click',e=>{ stationPills.forEach(x=>x.classList.remove('active')); e.currentTarget.classList.add('active'); const wasPlaying=isPlaying; currentUrl=e.currentTarget.dataset.url; loadStream(currentUrl); if(wasPlaying) setTimeout(()=>{ audioEl.play().catch(()=>{}); },500); }); });
modeBtns.forEach(b=>{ b.addEventListener('click',e=>{ modeBtns.forEach(x=>x.classList.remove('active')); e.currentTarget.classList.add('active'); currentMode=e.currentTarget.dataset.mode; }); });
btnPower.addEventListener('click',toggle);
btnPlay.addEventListener('click',toggle);
gsap.set(aboutTray, { yPercent:-120, scale:0.82, opacity:0, xPercent:-50 });
function showAboutTray(){ if(aboutTl) aboutTl.kill(); aboutTl=gsap.timeline(); aboutTl.to(aboutTray, { yPercent:0, scale:1, opacity:1, duration:0.7, ease:"power4.inOut" }).to(aboutTray, { yPercent:-120, scale:0.82, opacity:0, duration:0.65, ease:"power4.inOut", delay:5 }); }
aboutBtn.addEventListener('click', (e)=>{ e.stopPropagation(); showAboutTray(); });
gsap.set(splashBar, { xPercent:-100 });
gsap.to(splashBar, { xPercent:0, duration:1.1, ease:"power4.inOut" });
function hideSplash(){ if(splash.dataset.hidden) return; splash.dataset.hidden="1"; gsap.timeline().to(splashBar, { xPercent:100, duration:0.35, ease:"power4.inOut" }, 0).to("#splash .splash-logo", { scale:1.15, duration:0.55, ease:"power4.inOut" }, 0.1).to(splash, { opacity:0, scale:1.06, duration:0.7, ease:"power4.inOut", onComplete:()=>{ splash.style.display='none'; } }, 0.3); }
audioEl.addEventListener('canplay', hideSplash);
window.addEventListener('load', ()=>{ setTimeout(hideSplash, 2000); });
function attemptAutoplay(){ initEngine(); audioEl.muted=false; audioEl.play().then(()=>{ isPlaying=true; btnPower.classList.add('playing'); playIcon.className='ph ph-pause'; setStatus('live','مباشر • LIVE'); hideSplash(); }).catch(()=>{ setStatus('paused','اضغط للتشغيل • 98.4 Shabab'); }); }
function draw(){ requestAnimationFrame(draw); if(analyser) analyser.getByteFrequencyData(dataArray); const w=500,h=500,cx=w/2,cy=h/2; ctxO.clearRect(0,0,w,h); ctxI.clearRect(0,0,w,h); const baseR=132; const maxBar=92; if(currentMode==='bars' || currentMode==='nebula'){ const count=96; const step=Math.floor((bufferLen*0.72)/count); const isNeb= currentMode==='nebula'; for(let i=0;i<count;i++){ const idx=i*step; const target= analyser ? dataArray[idx]/255 : 0.03+Math.sin(Date.now()*0.001+i*0.12)*0.015; smoothed[i]+=(target-smoothed[i])*0.26; const val=smoothed[i]; if(val>=peaks[i]){ peaks[i]=val; vels[i]=0; } else { vels[i]+=0.0032; peaks[i]-=vels[i]; if(peaks[i]<0) peaks[i]=0; } const angle=(i/count)*Math.PI*2 - Math.PI/2; const barLen= val*maxBar; const x1=cx+Math.cos(angle)*baseR; const y1=cy+Math.sin(angle)*baseR; const x2=cx+Math.cos(angle)*(baseR+barLen); const y2=cy+Math.sin(angle)*(baseR+barLen); const grad=ctxO.createLinearGradient(x1,y1,x2,y2); grad.addColorStop(0,'rgba(255,255,255,0.94)'); grad.addColorStop(0.18,'#ff6b6b'); grad.addColorStop(1,'#7f0c16'); ctxO.beginPath(); ctxO.moveTo(x1,y1); ctxO.lineTo(x2,y2); ctxO.lineWidth= isNeb?1.6:3; ctxO.lineCap='round'; ctxO.strokeStyle= isNeb? 'rgba(255,60,60,0.30)' : grad; if(isNeb){ ctxO.shadowBlur=18; ctxO.shadowColor='#ff2e2e'; } ctxO.stroke(); ctxO.shadowBlur=0; if(!isNeb && peaks[i]>0.05){ const pr= baseR + peaks[i]*maxBar + 7; const px=cx+Math.cos(angle)*pr; const py=cy+Math.sin(angle)*pr; ctxI.beginPath(); ctxI.arc(px,py,1.9,0,Math.PI*2); ctxI.fillStyle='#fff'; ctxI.shadowBlur=10; ctxI.shadowColor='#ff3b3b'; ctxI.fill(); ctxI.shadowBlur=0; } } } else if(currentMode==='pulse'){ let sum=0; for(let i=0;i<28;i++) sum+= analyser?dataArray[i]:0; const avg=(sum/28)/255; const r=baseR+avg*110; ctxO.beginPath(); ctxO.arc(cx,cy,r,0,Math.PI*2); ctxO.lineWidth=2+avg*16; ctxO.strokeStyle=`rgba(255,59,59,${0.32+avg*0.6})`; ctxO.shadowBlur=36*avg; ctxO.shadowColor='#ff3b3b'; ctxO.stroke(); ctxO.shadowBlur=0; } }
loadStream(currentUrl);
requestAnimationFrame(draw);
window.addEventListener('load', ()=>{ setTimeout(attemptAutoplay, 700); });
let firstInteraction=false;
function handleFirstInteraction(){ if(firstInteraction) return; firstInteraction=true; if(!isPlaying) attemptAutoplay(); window.removeEventListener('click', handleFirstInteraction); window.removeEventListener('touchstart', handleFirstInteraction); }
window.addEventListener('click', handleFirstInteraction);
window.addEventListener('touchstart', handleFirstInteraction);
</script>
