<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>إذاعة البحرين • Radio Bahrain</title>
    <meta name="theme-color" content="#120204" />
    <style>
      :root {
        --bg-0: #120204;
        --red: #ff3b3b;
        --red-strong: #8e0f1d;
        --panel: rgba(10, 10, 12, 0.38);
        --panel-border: rgba(255, 255, 255, 0.1);
        --text: #f7f1ee;
        --bg-focus-x: 50%;
        --bg-focus-y: 43%;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-0);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body { position: relative; }

      .bg-layer, .bg-layer--back {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: var(--bg-focus-x) var(--bg-focus-y);
        transition: opacity 1.1s ease, transform 1.2s ease, filter 1.2s ease;
        transform: scale(1.02);
      }
      .bg-layer {
        z-index: 1;
        opacity: 1;
        background-image: linear-gradient(rgba(5, 1, 3, 0.14), rgba(5, 1, 3, 0.72)), url('./assets/default.jpg');
      }
      .bg-layer--back {
        z-index: 0;
        opacity: 0;
        filter: blur(12px) saturate(1.2);
      }
      .bg-layer::after, .bg-layer--back::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 70% 24%, rgba(255, 98, 98, 0.25), transparent 30%), linear-gradient(to bottom, rgba(8, 1, 3, 0.16), rgba(8, 1, 3, 0.76));
      }
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 56%, rgba(0, 0, 0, 0.72) 100%);
      }

      .app {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
        height: 100dvh;
      }
      .top-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        width: auto;
        margin-top: 2.6vh;
        z-index: 30;
      }
      .top-nav {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 8px;
        border-radius: 9999px;
        background: rgba(7, 7, 8, 0.42);
        border: 1px solid var(--panel-border);
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(18px);
      }
      .mode-btn, .about-btn, .station-pill, .control-btn, #startButton { cursor: pointer; user-select: none; }
      .mode-btn {
        width: 40px; height: 40px; border: none; border-radius: 50%;
        display: grid; place-items: center; color: rgba(255,255,255,0.72); background: transparent; font-size: 20px;
      }
      .mode-btn.active {
        background: linear-gradient(135deg, var(--red), var(--red-strong));
        color: white; box-shadow: 0 0 16px rgba(255, 59, 59, 0.5);
      }
      .about-btn {
        width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: white; font-size: 12px; font-weight: 800;
      }
      .about-tray {
        position: absolute; top: calc(100% + 10px); left: 50%; z-index: 1;
        width: auto; min-width: 196px; max-width: 240px; padding: 9px 18px; border-radius: 9999px;
        background: rgba(0,0,0,0.46); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 36px rgba(0,0,0,0.42);
        pointer-events: none; transform-origin: top center; opacity: 0; backdrop-filter: blur(22px); display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .about-tray .line1, .about-tray .line2 { text-align: center; white-space: nowrap; line-height: 1.3; }
      .about-tray .line1 { font-size: 11px; font-weight: 700; }
      .about-tray .line2 { font-size: 10px; color: rgba(255,255,255,0.74); }

      .stage {
        display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; padding-bottom: 6vh;
      }
      .logo-stack {
        position: relative; width: min(72vw, 500px); height: min(72vw, 500px); display: flex; align-items: center; justify-content: center;
      }
      #canvas-outer, #canvas-inner {
        position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
      }
      .logo-hit {
        position: relative; z-index: 2; width: min(45vw, 220px); height: min(45vw, 220px); border-radius: 50%;
        display: grid; place-items: center; cursor: pointer; background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.12), rgba(0,0,0,0.2) 52%, rgba(0,0,0,0.58) 100%);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 18px 60px rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.2); transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .logo-hit.playing { box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 0 28px rgba(255, 59, 59, 0.48), 0 18px 60px rgba(0,0,0,0.55); }
      .logo-badge {
        width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%;
        background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.12), rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.65) 100%); color: rgba(255,255,255,0.92);
        font-weight: 900; letter-spacing: 0.25em; font-size: clamp(0.8rem, 2vw, 1.2rem); text-shadow: 0 0 18px rgba(255,255,255,0.35);
      }
      .guide-ring {
        position: absolute; width: min(70vw, 340px); height: min(70vw, 340px); border-radius: 50%; border: 1px solid rgba(255,255,255,0.08);
        top: 50%; left: 50%; transform: translate(-50%, -50%);
      }
      .status { margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 5; }
      .live-dot {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 9999px; background: rgba(0,0,0,0.38); border: 1px solid rgba(255,255,255,0.12);
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      }
      .live-dot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
      .live-dot.live .dot { animation: blink 1.1s infinite alternate; }
      @keyframes blink { 0% { opacity: 0.55; } 100% { opacity: 1; } }

      .bottom {
        z-index: 20; width: 100%; max-width: 460px; padding: 0 16px 18px; display: flex; flex-direction: column; gap: 12px;
      }
      .stations { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .station-pill {
        padding: 9px 16px; border-radius: 9999px; font-size: 13px; font-weight: 700; background: rgba(0,0,0,0.34); border: 1px solid rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.82); backdrop-filter: blur(10px); transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }
      .station-pill.active { background: linear-gradient(135deg, var(--red), var(--red-strong)); color: white; border-color: rgba(255,255,255,0.18); box-shadow: 0 0 20px rgba(255,46,46,0.45); }
      .controls {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: 16px; background: rgba(0,0,0,0.36); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; backdrop-filter: blur(16px);
      }
      .control-btn {
        width: 46px; height: 46px; border: none; border-radius: 50%; background: rgba(255,255,255,0.94); color: #130306; display: grid; place-items: center; font-size: 20px;
      }
      .control-btn.secondary { width: 40px; height: 40px; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: white; }
      .slider-wrap { display: flex; align-items: center; gap: 10px; flex: 1; }
      input[type="range"] { width: 100%; accent-color: var(--red); }

      #splash {
        position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(64, 11, 18, 0.9), rgba(15, 2, 5, 0.95)); transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-logo { width: 180px; height: 180px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
      .splash-logo span { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.92); font-weight: 900; letter-spacing: 0.26em; font-size: 1.05rem; }
      .splash-title { margin-top: 20px; font-weight: 800; font-size: clamp(1.3rem, 4vw, 2rem); }
      .splash-sub { margin-top: 4px; font-size: 11px; opacity: 0.64; letter-spacing: 0.18em; text-transform: uppercase; }
      .splash-bar-wrap { margin-top: 22px; width: min(52vw, 120px); height: 2px; background: rgba(255,255,255,0.12); border-radius: 9999px; overflow: hidden; }
      .splash-bar { width: 100%; height: 100%; background: linear-gradient(90deg, var(--red), rgba(255,255,255,0.9)); transform: translateX(-101%); }
      #startButton {
        margin-top: 24px; opacity: 0; visibility: hidden; pointer-events: none; padding: 14px 32px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9999px; background: linear-gradient(135deg, rgba(255, 59, 59, 0.98), rgba(145, 14, 30, 0.94)); color: white; font-size: 0.9rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 22px 48px rgba(165, 0, 0, 0.3); transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.25s ease;
      }
      #startButton.visible { opacity: 1; visibility: visible; pointer-events: auto; }
      #startButton:hover { transform: translateY(-1px) scale(1.02); }

      @media (max-width: 560px) {
        .stations { gap: 6px; }
        .station-pill { font-size: 12px; padding: 8px 12px; }
        .controls { gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="bg-layer--back" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div id="splash">
      <div class="splash-logo"><span>RADIO</span></div>
      <div class="splash-title ar">إذاعة البحرين</div>
      <div class="splash-sub">Radio Bahrain • Live</div>
      <div class="splash-bar-wrap"><div class="splash-bar" id="splashBar"></div></div>
      <button id="startButton" type="button">ابدأ الاستماع</button>
    </div>

    <div class="app">
      <div class="top-wrap">
        <div class="top-nav">
          <button class="mode-btn active" data-mode="bars" type="button" aria-label="Wave bars">◉</button>
          <button class="mode-btn" data-mode="cline" type="button" aria-label="Wave line">≈</button>
          <button class="mode-btn" data-mode="particles" type="button" aria-label="Particles">✦</button>
          <button class="mode-btn" data-mode="pulse" type="button" aria-label="Pulse">◌</button>
          <button class="mode-btn" data-mode="nebula" type="button" aria-label="Nebula">✧</button>
          <button class="about-btn" id="aboutBtn" type="button" aria-label="About">i</button>
        </div>
        <div class="about-tray" id="aboutTray">
          <div class="line1 ar">صنع بكل حب في البحرين</div>
          <div class="line2 ar">م/ حسن الدوي 2026</div>
        </div>
      </div>

      <div class="stage">
        <div class="logo-stack">
          <div class="guide-ring"></div>
          <canvas id="canvas-outer" width="500" height="500"></canvas>
          <canvas id="canvas-inner" width="500" height="500"></canvas>
          <div class="logo-hit" id="btnPower" aria-label="Toggle live stream">
            <div class="logo-badge">RADIO</div>
          </div>
        </div>

        <div class="status">
          <div class="live-dot" id="liveDot">
            <span class="dot"></span>
            <span id="statusText" class="ar">جارٍ التحضير…</span>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div class="stations">
          <button class="station-pill active ar" type="button" data-channel="shabab" data-bg="./assets/shabab-98-4.jpg" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-98-4_all/chunklist_w1027272218_b981072.m3u8">98.4 FM Shabab</button>
          <button class="station-pill ar" type="button" data-channel="bahrain" data-bg="./assets/bahrain-fm-93-3.jpg" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-93-3_all/chunklist_w984020168_b981072.m3u8">93.3 بحرين FM</button>
          <button class="station-pill ar" type="button" data-channel="shaabia" data-bg="./assets/shaabia-95-0.jpg" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-95-0_all/chunklist_w283029004_b981072.m3u8">الشعبية 95.0 FM</button>
          <button class="station-pill ar" type="button" data-channel="quran" data-bg="./assets/default.jpg" data-url="https://5c7b683162943.streamlock.net/live/ngrp:radio-106-1_all/chunklist_w1199630148_b981072.m3u8">القرآن الكريم 106.1 FM</button>
        </div>

        <div class="controls">
          <button id="btnPlay" class="control-btn" type="button" aria-label="Play or pause audio">
            <span id="playIcon">▶</span>
          </button>
          <div class="slider-wrap">
            <span>🔊</span>
            <input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume" />
          </div>
          <button id="btnMute" class="control-btn secondary" type="button" aria-label="Mute sound">🔇</button>
        </div>
      </div>
    </div>

    <audio id="audio" crossorigin="anonymous" preload="auto" style="display:none"></audio>

    <script src="../node_modules/gsap/dist/gsap.js"></script>
    <script src="../node_modules/hls.js/dist/hls.js"></script>
    <script>
      const stations = Array.from(document.querySelectorAll('.station-pill'));
      const audioEl = document.getElementById('audio');
      const statusText = document.getElementById('statusText');
      const liveDot = document.getElementById('liveDot');
      const btnPower = document.getElementById('btnPower');
      const btnPlay = document.getElementById('btnPlay');
      const btnMute = document.getElementById('btnMute');
      const vol = document.getElementById('vol');
      const playIcon = document.getElementById('playIcon');
      const splash = document.getElementById('splash');
      const startButton = document.getElementById('startButton');
      const splashBar = document.getElementById('splashBar');
      const aboutBtn = document.getElementById('aboutBtn');
      const aboutTray = document.getElementById('aboutTray');
      const canvasOuter = document.getElementById('canvas-outer');
      const canvasInner = document.getElementById('canvas-inner');
      const ctxOuter = canvasOuter.getContext('2d');
      const ctxInner = canvasInner.getContext('2d');
      const modeButtons = document.querySelectorAll('.mode-btn');
      const bgFront = document.querySelector('.bg-layer');
      const bgBack = document.querySelector('.bg-layer--back');

      let audioCtx;
      let analyser;
      let gainNode;
      let sourceNode;
      let hls;
      let currentMode = 'bars';
      let isPlaying = false;

      const stationData = stations.reduce((map, station) => {
        map[station.dataset.channel] = {
          url: station.dataset.url,
          bg: station.dataset.bg
        };
        return map;
      }, {});

      function setStatus(state, text) {
        statusText.textContent = text;
        liveDot.classList.toggle('live', state === 'live');
      }

      function updateBackgroundStation(channelName) {
        const nextImage = (stationData[channelName] || stationData.shabab)?.bg || './assets/default.jpg';
        const focusPosition = '50% 43%';

        bgFront.style.backgroundPosition = focusPosition;
        bgBack.style.backgroundPosition = focusPosition;
        bgBack.style.backgroundImage = `linear-gradient(rgba(5, 1, 3, 0.14), rgba(5, 1, 3, 0.72)), url("${nextImage}")`;
        bgBack.style.opacity = '1';
        bgBack.style.transform = 'scale(1.08)';
        bgBack.style.filter = 'blur(12px) saturate(1.2)';

        gsap.to(bgFront, { opacity: 0, scale: 1.12, filter: 'blur(14px) saturate(1.2)', duration: 1.2, ease: 'power2.inOut' });
        gsap.to(bgBack, {
          opacity: 1,
          scale: 1,
          filter: 'blur(0px) saturate(1.2)',
          duration: 1.2,
          ease: 'power2.inOut',
          onComplete: () => {
            bgFront.style.backgroundImage = bgBack.style.backgroundImage;
            bgFront.style.backgroundPosition = focusPosition;
            bgFront.style.opacity = '1';
            bgFront.style.filter = 'blur(0px)';
            bgFront.style.transform = 'scale(1)';
            bgBack.style.opacity = '0';
            bgBack.style.filter = 'blur(12px) saturate(1.2)';
            bgBack.style.transform = 'scale(1.08)';
          }
        });
      }

      function initAudioEngine() {
        if (audioCtx) return;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtor();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.55;

        gainNode = audioCtx.createGain();
        sourceNode = audioCtx.createMediaElementSource(audioEl);
        sourceNode.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        gainNode.gain.value = Number(vol.value);
      }

      function loadStream(url) {
        if (hls) { hls.destroy(); hls = null; }
        setStatus('loading', 'جاري التحميل…');

        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true, lowLatencyMode: false });
          hls.loadSource(url);
          hls.attachMedia(audioEl);
        } else {
          audioEl.src = url;
        }
      }

      async function startPlayback() {
        initAudioEngine();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const station = document.querySelector('.station-pill.active') || stations[0];
        loadStream(station.dataset.url);

        try {
          await audioEl.play();
          isPlaying = true;
          btnPower.classList.add('playing');
          playIcon.textContent = '❚❚';
          setStatus('live', 'مباشر • LIVE');
        } catch (error) {
          isPlaying = false;
          setStatus('paused', 'اضغط للتشغيل');
        }
      }

      function togglePlayback() {
        if (!isPlaying) {
          startPlayback();
          return;
        }
        audioEl.pause();
        isPlaying = false;
        btnPower.classList.remove('playing');
        playIcon.textContent = '▶';
        setStatus('paused', 'متوقف');
      }

      function setActiveStation(button) {
        stations.forEach((station) => station.classList.toggle('active', station === button));
        const channel = button.dataset.channel;
        updateBackgroundStation(channel);

        if (stationData[channel]?.url) {
          loadStream(stationData[channel].url);
          if (isPlaying) {
            audioEl.play().catch(() => {});
          }
        }
      }

      function revealStartButton() {
        gsap.to(splashBar, {
          xPercent: 0,
          duration: 1.2,
          ease: 'power4.inOut',
          onComplete: () => {
            startButton.classList.add('visible');
            gsap.to(startButton, { opacity: 1, duration: 0.35, ease: 'power2.out' });
          }
        });
      }

      function hideSplash() {
        splash.classList.add('hidden');
      }

      startButton.addEventListener('click', async () => {
        await startPlayback();
        hideSplash();
      });

      btnPower.addEventListener('click', togglePlayback);
      btnPlay.addEventListener('click', togglePlayback);
      btnMute.addEventListener('click', () => {
        if (!gainNode) return;
        const currentGain = Number(gainNode.gain.value);
        const nextGain = currentGain > 0 ? 0 : Number(vol.value || 0.85);
        gainNode.gain.value = nextGain;
        audioEl.volume = nextGain;
      });
      vol.addEventListener('input', (event) => {
        const value = Number(event.target.value);
        if (gainNode) gainNode.gain.value = value;
        audioEl.volume = value;
      });

      stations.forEach((station) => {
        station.addEventListener('click', () => setActiveStation(station));
      });
      modeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          modeButtons.forEach((item) => item.classList.toggle('active', item === button));
          currentMode = button.dataset.mode;
        });
      });

      aboutBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (aboutTray.style.opacity === '1') {
          gsap.to(aboutTray, { opacity: 0, yPercent: -10, scale: 0.9, duration: 0.35, ease: 'power2.out' });
          return;
        }
        gsap.set(aboutTray, { yPercent: -15, scale: 0.9, opacity: 0, xPercent: -50 });
        gsap.to(aboutTray, { opacity: 1, yPercent: 0, scale: 1, duration: 0.5, ease: 'power4.inOut' });
      });
      document.addEventListener('click', (event) => {
        if (event.target !== aboutBtn && !aboutBtn.contains(event.target)) {
          gsap.to(aboutTray, { opacity: 0, yPercent: -12, scale: 0.9, duration: 0.28, ease: 'power2.out' });
        }
      });

      audioEl.addEventListener('playing', () => {
        isPlaying = true; btnPower.classList.add('playing'); playIcon.textContent = '❚❚'; setStatus('live', 'مباشر • LIVE');
      });
      audioEl.addEventListener('pause', () => {
        isPlaying = false; btnPower.classList.remove('playing'); playIcon.textContent = '▶';
      });
      audioEl.addEventListener('waiting', () => setStatus('loading', 'جاري التحميل…'));
      audioEl.addEventListener('canplay', () => {
        if (isPlaying) setStatus('live', 'مباشر • LIVE');
        else setStatus('ready', 'جاهز للتشغيل');
      });

      function draw() {
        requestAnimationFrame(draw);
        const width = 500; const height = 500; const centerX = width / 2; const centerY = height / 2; const baseRadius = 132; const maxBar = 92;
        ctxOuter.clearRect(0, 0, width, height); ctxInner.clearRect(0, 0, width, height);

        const bars = new Float32Array(96);
        if (analyser) {
          const frequencyData = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(frequencyData);
          for (let i = 0; i < 96; i++) {
            const index = Math.min(frequencyData.length - 1, Math.floor((i / 96) * frequencyData.length));
            bars[i] = frequencyData[index] / 255;
          }
        }

        if (currentMode === 'bars' || currentMode === 'nebula') {
          const isNebula = currentMode === 'nebula';
          for (let i = 0; i < 96; i++) {
            const angle = (i / 96) * Math.PI * 2 - Math.PI / 2;
            const value = bars[i] || 0.12;
            const radius = baseRadius + value * maxBar;
            const x1 = centerX + Math.cos(angle) * baseRadius;
            const y1 = centerY + Math.sin(angle) * baseRadius;
            const x2 = centerX + Math.cos(angle) * radius;
            const y2 = centerY + Math.sin(angle) * radius;

            ctxOuter.beginPath();
            ctxOuter.moveTo(x1, y1);
            ctxOuter.lineTo(x2, y2);
            ctxOuter.lineWidth = isNebula ? 1.5 : 2.9;
            ctxOuter.strokeStyle = isNebula ? 'rgba(255,60,60,0.25)' : 'rgba(255,120,120,0.96)';
            ctxOuter.lineCap = 'round';
            if (isNebula) { ctxOuter.shadowBlur = 18; ctxOuter.shadowColor = '#ff3b3b'; }
            ctxOuter.stroke();
            ctxOuter.shadowBlur = 0;
          }
        } else if (currentMode === 'pulse') {
          const average = analyser
            ? Array.from(new Uint8Array(analyser.frequencyBinCount)).slice(0, 28).reduce((sum, value) => sum + value, 0) / 28 / 255
            : 0.2;
          const pulseRadius = baseRadius + average * 110;
          ctxOuter.beginPath();
          ctxOuter.arc(centerX, centerY, pulseRadius, 0, Math.PI * 2);
          ctxOuter.lineWidth = 2 + average * 16;
          ctxOuter.strokeStyle = `rgba(255,59,59,${0.32 + average * 0.7})`;
          ctxOuter.shadowBlur = 28 * (average + 0.1);
          ctxOuter.shadowColor = '#ff3b3b';
          ctxOuter.stroke();
          ctxOuter.shadowBlur = 0;
        } else if (currentMode === 'cline') {
          ctxOuter.beginPath();
          ctxOuter.moveTo(0, centerY);
          for (let i = 0; i < 96; i++) {
            const value = bars[i] || 0.1;
            const x = (i / 95) * width;
            const y = centerY + (value - 0.5) * 150;
            ctxOuter.lineTo(x, y);
          }
          ctxOuter.lineWidth = 2; ctxOuter.strokeStyle = 'rgba(255,120,120,0.9)'; ctxOuter.stroke();
        } else if (currentMode === 'particles') {
          for (let i = 0; i < 70; i++) {
            const angle = (i / 70) * Math.PI * 2 + Date.now() * 0.0007;
            const radius = baseRadius + (bars[i % bars.length] || 0.1) * 120;
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;
            ctxOuter.beginPath();
            ctxOuter.arc(x, y, 1.7 + (bars[i % bars.length] || 0.1) * 4, 0, Math.PI * 2);
            ctxOuter.fillStyle = 'rgba(255,255,255,0.86)';
            ctxOuter.fill();
          }
        }
      }

      gsap.set(splashBar, { xPercent: -100 });
      gsap.set(aboutTray, { yPercent: -15, scale: 0.9, opacity: 0, xPercent: -50 });
      updateBackgroundStation('shabab');
      revealStartButton();
      draw();
    </script>
  </body>
</html>
