<style>

.sub{font-size:12px;font-weight:400;color:var(--muted);margin-top:6px;line-height:1.6}
.controls{display:flex;align-items:center;gap:10px}
.navBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.25s;backdrop-filter:blur(10px)}

.thumbStripWrap::before,.thumbStripWrap::after{content:"";position:absolute;top:2px;bottom:2px;width:96px;z-index:3;pointer-events:none;transition:.4s opacity,.4s transform}

.loadBox{text-align:center}
.loadTitle{font-size:24px;font-weight:900;margin-bottom:10px;letter-spacing:-.01em}
.loadBar{width:200px;height:2px;background:var(--bd);margin:16px auto 0;overflow:hidden;border-radius:999px;position:relative}

@keyframes load{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:left}}
</style>

async function loadPlaylists(){
  try{
    const res = await fetch(LIVE_URL,{mode:'cors'});
    if(!res.ok) throw new Error('fetch fail');
    const data = await res.json();
    const mapped = data.items.map(i=>({id:i.id,title:i.snippet.title,thumb:i.snippet.thumbnails.medium.url,count:i.contentDetails.itemCount})).filter(it=>!it.title.includes('ليالي المنامة'));
    if(mapped.length) return mapped;
    return FALLBACK;
  }catch(e){ return FALLBACK; }
}
function clamp(v,min,max){return Math.max(min, Math.min(max, v));}
function mockEpisodes(playlist){
  const n = playlist.count;
  const eps = [];
  for(let i=1;i<=n;i++){
    const d = new Date(Date.now() - i*86400000*2.3);
    const mins = 12 + (i*7)%48;
    const secs = (i*13)%60;
    eps.push({
      num:i,
      title: `${playlist.title} — الحلقة ${i}`,
      thumb: playlist.thumb,
      duration: `${mins}:${String(secs).padStart(2,'0')}`,
      date: d.toLocaleDateString('ar-BH',{year:'numeric',month:'short',day:'numeric'}),
      views: `${(2.3 + i*0.7).toFixed(1)}k`
    });
  }
  return eps;
}

        })
        .fromTo(titleMain, {y:14, opacity:0, rotationX:8}, {y:0, opacity:1, rotationX:0, duration:.45, ease:'power3.out'});
        updateButtons(); updateStripEdges();
      }
    }
  }
  gsap.ticker.add(render);
  goTo(0); updateButtons();
  document.getElementById('loading').classList.add('hide');
  setTimeout(()=>document.getElementById('loading').style.display='none', 700);
})();
</script>
</body>
</html>
